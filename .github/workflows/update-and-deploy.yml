
name: Update ETF Data and Deploy

on:
  schedule:
    # 한국시간 매일 오전 8시 30분, 오후 8시 30분
    - cron: "30 23, 11 * * *"

  workflow_dispatch:

  push:
    branches:
      - chatgpt
    paths:
      - "collector/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monthly-dividend-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: chatgpt

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect ETF data
        run: |
          python collector/update_data.py
          python collector/update_fedwatch.py
          python collector/update_feargreed.py
          python collector/update_kfeargreed.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/data/etfs.json site/data/fedwatch.json site/data/feargreed.json site/data/kfeargreed.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily ETF dividend data"
            git push origin HEAD:chatgpt
          else
            echo "No data changes."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
