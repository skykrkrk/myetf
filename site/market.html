<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 지수 & 영구선물 Sparkline 모니터</title>
  <style>
    :root {
      --bg: #101319;
      --card: #191e27;
      --text: #edf0f5;
      --muted: #a1aaba;
      --up: #80c6a2;
      --down: #f0575b;
      --border: #2a313d;
      --shadow: 0 12px 35px rgba(0, 0, 0, .18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", "Noto Sans KR", sans-serif;
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 84px;
      padding: 16px max(calc((100% - 1400px) / 2 + 24px), 24px);
      border-bottom: 1px solid var(--border);
      background: #141820;
    }
    h1 { font-size: 15px; font-weight: 800; letter-spacing: -.5px; }
    .status { font-size: 8.5px; color: var(--muted); }
    .status span { color: var(--up); font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px 17px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .name { font-weight: 600; font-size: 0.88rem; }
    .badge {
      font-size: 0.58rem;
      padding: 2px 5px;
      border-radius: 5px;
      background: #3a2927;
      color: #ffad91;
      margin-left: 6px;
    }
    .symbol { font-size: 0.60rem; color: var(--muted); margin-top: 2px; }
    .price-box { text-align: right; }
    .price { display: inline-block; padding: 0 2px; border-radius: 3px; font-size: 0.90rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    @keyframes price-flash-up {
      from { background-color: rgba(30, 255, 30, .4); }
      to { background-color: transparent; }
    }
    @keyframes price-flash-down {
      from { background-color: rgba(255, 30, 30, .4); }
      to { background-color: transparent; }
    }
    .price-flash-up { animation: price-flash-up 3000ms ease-out; }
    .price-flash-down { animation: price-flash-down 3000ms ease-out; }
    .change { font-size: 0.70rem; font-weight: 600; margin-top: 2px; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    svg.sparkline {
      width: 100%;
      height: 50px;
      overflow: visible;
    }
    @media (max-width: 760px) {
      header { min-height: 62px; padding: 12px 17px; flex-wrap: wrap; gap: 8px; }
      h1 { font-size: 12px; }
      .grid { gap: 10px; padding: 16px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>실시간 글로벌 지수 & 영구선물 모니터 (시장 구간 Sparkline)</h1>
    <div class="status">WebSocket: <span id="ws-status">연결 중...</span></div>
  </header>

  <div class="grid" id="dashboard"></div>

  <script>
    const HL_INFO_URL = "https://api.hyperliquid.xyz/info";
    const HL_WS_URL = "wss://api.hyperliquid.xyz/ws";

    // Yahoo 시세와 Hyperliquid 장외 시세를 자산별로 연결
    const ASSETS = [
      { id: "KOSPI",    name: "코스피",     yahooSymbol: "^KS11" },
      { id: "KOSDAQ",   name: "코스닥",     yahooSymbol: "^KQ11" },
      { id: "KOSPI200", name: "코스피200",  yahooSymbol: "^KS200", hlSymbol: "xyz:KR200" },
      { id: "USDKRW",   name: "원달러환율", yahooSymbol: "KRW=X" },
      { id: "BTC",      name: "Bitcoin",   hlSymbol: "BTC" },
      { id: "SP500",    name: "S&P500",    yahooSymbol: "^GSPC", hlSymbol: "xyz:SP500", yahooSparkline: true },
      { id: "NASDAQ",   name: "Nasdaq100",   yahooSymbol: "^NDX", hlSymbol: "xyz:XYZ100", yahooSparkline: true },
      { id: "GOOGL",    name: "Google",    yahooSymbol: "GOOGL", hlSymbol: "xyz:GOOGL", yahooSparkline: true },
      { id: "ANT",      name: "Anthropic", yahooSymbol: "ANT", hlSymbol: "xyz:ANT", yahooSparkline: true },
      { id: "AAPL",     name: "Apple",     yahooSymbol: "AAPL", hlSymbol: "xyz:AAPL", yahooSparkline: true },
      { id: "NVDA",     name: "Nvidia",    yahooSymbol: "NVDA", hlSymbol: "xyz:NVDA", yahooSparkline: true },
      { id: "SPCX",     name: "Space X",   yahooSymbol: "SPCX", hlSymbol: "xyz:SPCX", yahooSparkline: true },
      { id: "BRENT",    name: "Brent Oil", yahooSymbol: "BZ=F", hlSymbol: "xyz:BRENTOIL", yahooSparkline: true },
      { id: "DXY",      name: "USD Index", yahooSymbol: "DX-Y.NYB" },
    ];

    const state = {}; // id -> { yahoo?: quote data, hl?: chart data }

    // 1. 초기 카드 UI 렌더링
    function initCards() {
      const container = document.getElementById("dashboard");
      container.innerHTML = ASSETS.map(asset => `
        <div class="card" id="card-${asset.id}">
          <div class="card-top">
            <div>
              <div class="name">${asset.name}${asset.hlSymbol ? `<span class="badge" id="badge-${asset.id}">PERP</span>` : ""}</div>
              <div class="symbol" id="sym-${asset.id}">심볼 확인 중...</div>
            </div>
            <div class="price-box">
              <div class="price" id="price-${asset.id}">-</div>
              <div class="change" id="chg-${asset.id}">0.00%</div>
            </div>
          </div>
          <svg class="sparkline" id="svg-${asset.id}" viewBox="0 0 240 54" preserveAspectRatio="none"></svg>
        </div>
      `).join("");
    }

    // 2. SVG Sparkline 그리기
    function renderCard(id) {
      const asset = ASSETS.find(candidate => candidate.id === id);
      const item = state[id];
      if (!asset || !item) return;
      const priceEl = document.getElementById(`price-${id}`);
      const chgEl = document.getElementById(`chg-${id}`);
      const svg = document.getElementById(`svg-${id}`);
      if (!priceEl || !chgEl || !svg) return;

      const yahoo = item.yahoo;
      const hl = item.hl;
      const yahooPoints = Array.isArray(yahoo?.points) ? yahoo.points : [];
      const hlPoints = Array.isArray(hl?.points) ? hl.points : [];
      const marketClosed = yahoo?.marketOpen === false;
      const useHlSparkline = Boolean(asset.hlSymbol && (!asset.yahooSymbol || marketClosed));
      const useYahooSparkline = Boolean(asset.yahooSymbol
        && (!asset.hlSymbol || (asset.yahooSparkline && !marketClosed)));
      const showSparkline = useHlSparkline || useYahooSparkline;
      const chartPoints = useHlSparkline ? hlPoints : yahooPoints;
      const chartTimestamps = useHlSparkline ? hl?.timestamps : yahoo?.timestamps;
      const yahooLast = Number.isFinite(yahoo?.currentPrice) && yahoo.currentPrice > 0
        ? yahoo.currentPrice
        : yahooPoints[yahooPoints.length - 1];
      const hlLast = Number.isFinite(hl?.currentPrice) && hl.currentPrice > 0
        ? hl.currentPrice
        : hlPoints[hlPoints.length - 1];
      const hasHlPrice = Number.isFinite(hlLast) && hlLast > 0;
      const useYahooPrice = Boolean(asset.yahooSymbol && yahoo
        && (!asset.hlSymbol || !marketClosed || !hasHlPrice));
      const currentPrice = useYahooPrice ? yahooLast : hlLast;
      const referencePrice = useYahooPrice
        ? yahoo.referencePrice > 0 ? yahoo.referencePrice : hl?.referencePrice
        : asset.yahooSymbol && yahoo?.referencePrice > 0
          ? yahoo.referencePrice
          : hl?.referencePrice;
      const change = useYahooPrice && Number.isFinite(yahoo.change)
        ? yahoo.change
        : Number.isFinite(referencePrice)
          ? currentPrice - referencePrice
          : 0;
      const pct = useYahooPrice && Number.isFinite(yahoo.changePercent)
        ? yahoo.changePercent
        : referencePrice > 0
          ? ((currentPrice - referencePrice) / referencePrice) * 100
          : 0;
      const isUp = pct >= 0;
      const color = isUp ? "#22c55e" : "#ef4444";
      const badgeEl = document.getElementById(`badge-${id}`);
      const symbolEl = document.getElementById(`sym-${id}`);
      if (badgeEl) badgeEl.style.display = useHlSparkline ? "" : "none";
      if (symbolEl) symbolEl.textContent = useYahooPrice ? asset.yahooSymbol : asset.hlSymbol || asset.yahooSymbol;
      svg.style.display = showSparkline ? "" : "none";
      if (!showSparkline) svg.innerHTML = "";

      if (!Number.isFinite(currentPrice) || currentPrice <= 0) return;
      const decimals = currentPrice >= 1000 ? 2 : currentPrice >= 10 ? 2 : 4;
      const previousText = priceEl.textContent;
      const formattedPrice = currentPrice.toLocaleString("en-US", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });
      if (previousText !== "-" && previousText !== formattedPrice) {
        const previousPrice = Number(previousText.replace(/,/g, ""));
        priceEl.classList.remove("price-flash-up", "price-flash-down");
        void priceEl.offsetWidth;
        priceEl.classList.add(currentPrice > previousPrice ? "price-flash-up" : "price-flash-down");
      }
      priceEl.textContent = formattedPrice;

      const changeDecimals = 2;
      chgEl.textContent = `${change >= 0 ? "+" : ""}${change.toFixed(changeDecimals)} ${isUp ? "+" : ""}${pct.toFixed(2)}%`;
      chgEl.className = `change ${isUp ? "up" : "down"}`;

      if (!showSparkline || chartPoints.length < 2) return;

      const referenceLinePrice = asset.yahooSymbol && yahoo?.referencePrice > 0
        ? yahoo.referencePrice
        : hl?.referencePrice;
      const hasReferencePrice = Number.isFinite(referenceLinePrice) && referenceLinePrice > 0;
      const scalePoints = hasReferencePrice ? [...chartPoints, referenceLinePrice] : chartPoints;
      const min = Math.min(...scalePoints);
      const max = Math.max(...scalePoints);
      const range = max - min || 1;
      const w = 240;
      const h = 54;
      const pad = 4;
      const referenceY = hasReferencePrice
        ? h - pad - ((referenceLinePrice - min) / range) * (h - pad * 2)
        : null;

      const coords = chartPoints.map((val, idx) => {
        const x = (idx / (chartPoints.length - 1)) * w;
        const y = h - pad - ((val - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });

      let marketSessionBackground = "";
      const canHighlightBaseSession = yahoo
        && Number.isFinite(yahoo.regularStart)
        && Number.isFinite(yahoo.regularEnd)
        && Number.isFinite(yahoo.sessionEnd)
        && Array.isArray(chartTimestamps)
        && chartTimestamps.length === chartPoints.length;
      if (canHighlightBaseSession) {
        const timestampToX = timestamp => {
          const nextIndex = chartTimestamps.findIndex(value => value >= timestamp);
          if (nextIndex < 0) return w;
          if (nextIndex === 0) return 0;

          const previousTimestamp = chartTimestamps[nextIndex - 1];
          const nextTimestamp = chartTimestamps[nextIndex];
          const ratio = nextTimestamp > previousTimestamp
            ? (timestamp - previousTimestamp) / (nextTimestamp - previousTimestamp)
            : 0;
          return ((nextIndex - 1 + ratio) / (chartPoints.length - 1)) * w;
        };
        const startX = timestampToX(yahoo.regularStart);
        const endX = timestampToX(Math.min(yahoo.regularEnd, yahoo.sessionEnd));
        if (endX > startX) {
          marketSessionBackground = `<rect x="${startX.toFixed(1)}" y="0" width="${(endX - startX).toFixed(1)}" height="${h}" fill="#fff" fill-opacity="0.08" />`;
        }
      }

      svg.innerHTML = `
        ${marketSessionBackground}
        ${referenceY === null ? "" : `<line x1="0" y1="${referenceY.toFixed(1)}" x2="${w}" y2="${referenceY.toFixed(1)}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />`}
        <polyline fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${coords.join(" ")}" />
      `;
    }

    // 3. Hyperliquid POST 요청 헬퍼
    async function postHL(payload) {
      const res = await fetch(HL_INFO_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    // 4. Hyperliquid 캔들(15m) 로드
    async function loadHyperliquidCandlesForAsset(asset) {
      if (!asset.hlSymbol) return;
      const now = Date.now();
      const item = state[asset.id] || (state[asset.id] = {});
      const yahoo = item.yahoo;
      const baseMarketClosed = asset.yahooSymbol && yahoo?.marketOpen === false;
      const startTime = now - 48 * 60 * 60 * 1000;
      const candleStartTime = startTime - 15 * 60 * 1000;

      try {
        const candles = await postHL({
          type: "candleSnapshot",
          req: {
            coin: asset.hlSymbol,
            interval: "15m",
            startTime: candleStartTime,
            endTime: now
          }
        });
        if (Array.isArray(candles) && candles.length > 0) {
          const previousCandle = candles
            .filter(c => Number(c.t) < startTime)
            .slice(-1)[0];
          const chartCandles = candles.filter(c => Number(c.t) >= startTime);
          const closes = chartCandles.map(c => parseFloat(c.c));
          const timestamps = chartCandles.map(c => Number(c.t));
          const referencePrice = baseMarketClosed
            && yahoo.referencePrice > 0
            ? yahoo.referencePrice
            : previousCandle
              ? parseFloat(previousCandle.c)
              : null;
          item.hl = {
            points: closes,
            timestamps,
            currentPrice: closes[closes.length - 1] ?? null,
            referencePrice: Number.isFinite(referencePrice) ? referencePrice : null
          };
          renderCard(asset.id);
        } else {
          console.warn(`${asset.name} 캔들 데이터 없음`);
        }
      } catch (err) {
        console.error(`${asset.name} 캔들 로드 오류:`, err);
      }
    }

    async function loadHyperliquidCandles() {
      const hlAssets = ASSETS.filter(asset => asset.hlSymbol);
      await Promise.all(hlAssets.map(loadHyperliquidCandlesForAsset));
    }

    // 5. Hyperliquid WebSocket 실시간 스트리밍 (allMids)
    function connectHyperliquidWS() {
      const wsStatus = document.getElementById("ws-status");
      const ws = new WebSocket(HL_WS_URL);

      const hlAssets = ASSETS.filter(asset => asset.hlSymbol);
      const dexSet = new Set([""]);
      hlAssets.forEach(a => {
        if (a.hlSymbol.includes(":")) {
          dexSet.add(a.hlSymbol.split(":")[0]);
        }
      });

      ws.onopen = () => {
        wsStatus.textContent = "실시간 수신 중";
        wsStatus.style.color = "#22c55e";

        dexSet.forEach(dex => {
          const sub = { type: "allMids" };
          if (dex) sub.dex = dex;
          ws.send(JSON.stringify({ method: "subscribe", subscription: sub }));
        });
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.channel === "allMids" && msg.data?.mids) {
          const mids = msg.data.mids;
          hlAssets.forEach(asset => {
            const sym = asset.hlSymbol;
            const rawKey = sym.includes(":") ? sym.split(":")[1] : sym;
            const midStr = mids[sym] ?? mids[rawKey];

            if (midStr !== undefined) {
              const newPrice = parseFloat(midStr);
              if (!Number.isFinite(newPrice)) return;
              const item = state[asset.id] || (state[asset.id] = {});
              const hl = item.hl || (item.hl = { points: [], timestamps: [], referencePrice: null });
              if (hl.points.length) {
                hl.points[hl.points.length - 1] = newPrice;
              } else {
                hl.points.push(newPrice);
              }
              hl.currentPrice = newPrice;
              renderCard(asset.id);
            }
          });
        }
      };

      ws.onclose = () => {
        wsStatus.textContent = "재연결 중...";
        wsStatus.style.color = "#ef4444";
        setTimeout(connectHyperliquidWS, 3000);
      };
    }

    // 6. 야후 시세 48시간 차트 데이터 및 주기적 폴링
    async function loadYahooIndex(asset) {
      const symbolEl = document.getElementById(`sym-${asset.id}`);
      if (symbolEl) symbolEl.textContent = asset.yahooSymbol;
      const targetUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(asset.yahooSymbol)}?interval=15m&range=2d&includePrePost=true`;
      // 브라우저 CORS 우회용 공개 프록시 (실서비스 배포 시 자체 Edge/서버 프록시 교체 권장)
      //const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
      const proxyUrl = `https://ticker-proxy.skykrkrk.workers.dev/?url=${encodeURIComponent(targetUrl)}`;
      

      try {
        const res = await fetch(proxyUrl);
        const json = await res.json();
        const result = json?.chart?.result?.[0];
        const quoteCloses = result?.indicators?.quote?.[0]?.close || [];
        const quoteTimestamps = result?.timestamp || [];
        const chartData = quoteCloses
          .map((close, index) => ({ close, timestamp: quoteTimestamps[index] }))
          .filter(point => point.close !== null);
        const closes = chartData.map(point => point.close);

        if (closes && closes.length > 1) {
          const item = state[asset.id] || (state[asset.id] = {});
          const previousYahoo = item.yahoo;
          const change = Number(result.meta?.fulldayChange);
          const changePercent = Number(result.meta?.fulldayChangePercent);
          const currentPrice = Number(result.meta?.fulldayPrice);
          const regularPeriod = result.meta?.currentTradingPeriod?.regular;
          const regularStart = Number(regularPeriod?.start) * 1000;
          const regularEnd = Number(regularPeriod?.end) * 1000;
          const now = Date.now();
          const marketOpen = Number.isFinite(regularStart) && Number.isFinite(regularEnd)
            ? now >= regularStart && now < regularEnd
            : null;
          const referencePrice = Number(marketOpen === false
            ? result.meta?.regularMarketPrice ?? result.meta?.previousClose
            : result.meta?.previousClose);
          const sessionTimestamps = chartData
            .map(point => Number(point.timestamp) * 1000)
            .filter(Number.isFinite);
          const sessionEnd = sessionTimestamps[sessionTimestamps.length - 1];
          item.yahoo = {
            points: closes,
            timestamps: chartData.map(point => Number(point.timestamp) * 1000),
            marketOpen,
            sessionEnd,
            regularStart,
            regularEnd,
            currentPrice: Number.isFinite(currentPrice) && currentPrice > 0 ? currentPrice : null,
            referencePrice: Number.isFinite(referencePrice) ? referencePrice : null,
            change: Number.isFinite(change) ? change : null,
            changePercent: Number.isFinite(changePercent) ? changePercent : null
          };
          renderCard(asset.id);
          if (asset.hlSymbol && item.hl) {
            if (previousYahoo?.marketOpen !== marketOpen
              || (marketOpen === false && previousYahoo?.sessionEnd !== sessionEnd)) {
              loadHyperliquidCandlesForAsset(asset);
            }
          }
        }
      } catch (e) {
        console.warn(`${asset.name} 조회 실패:`, e);
      }
    }

    async function initYahooPolling() {
      const yahooAssets = ASSETS.filter(asset => asset.yahooSymbol);
      await Promise.all(yahooAssets.map(loadYahooIndex));
      setInterval(() => {
        yahooAssets.forEach(loadYahooIndex);
      }, 30000); // 30초마다 갱신
    }

    // 앱 시작
    (async function bootstrap() {
      initCards();
      await initYahooPolling();
      await loadHyperliquidCandles();
      connectHyperliquidWS();
    })();
  </script>
</body>
</html>
