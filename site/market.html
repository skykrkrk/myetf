<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 지수 & 영구선물 Sparkline 모니터</title>
  <style>
    :root {
      --bg: #101319;
      --card: #191e27;
      --text: #edf0f5;
      --muted: #a1aaba;
      --up: #80c6a2;
      --down: #f0575b;
      --border: #2a313d;
      --shadow: 0 12px 35px rgba(0, 0, 0, .18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", "Noto Sans KR", sans-serif;
      font-size: 12px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 84px;
      padding: 16px max(calc((100% - 1400px) / 2 + 24px), 24px);
      border-bottom: 1px solid var(--border);
      background: #141820;
    }
    h1 { font-size: 15px; font-weight: 800; letter-spacing: -.5px; }
    .status { font-size: 8.5px; color: var(--muted); }
    .status span { color: var(--up); font-weight: 600; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 16px 17px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: var(--shadow);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .name { font-weight: 600; font-size: 0.88rem; }
    .badge {
      font-size: 0.58rem;
      padding: 2px 5px;
      border-radius: 5px;
      background: #3a2927;
      color: #ffad91;
      margin-left: 6px;
    }
    .symbol { font-size: 0.66rem; color: var(--muted); margin-top: 2px; }
    .price-box { text-align: right; }
    .price { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .change { font-size: 0.70rem; font-weight: 600; margin-top: 2px; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    svg.sparkline {
      width: 100%;
      height: 50px;
      overflow: visible;
    }
    @media (max-width: 760px) {
      header { min-height: 62px; padding: 12px 17px; flex-wrap: wrap; gap: 8px; }
      h1 { font-size: 12px; }
      .grid { gap: 10px; padding: 16px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>실시간 글로벌 지수 & 영구선물 모니터 (24H Sparkline)</h1>
    <div class="status">WebSocket: <span id="ws-status">연결 중...</span></div>
  </header>

  <div class="grid" id="dashboard"></div>

  <script>
    const HL_INFO_URL = "https://api.hyperliquid.xyz/info";
    const HL_WS_URL = "wss://api.hyperliquid.xyz/ws";

    // 모니터링 대상 12개 자산 정의 (정확한 Hyperliquid HIP-3 심볼 우선 매칭 적용)
    const ASSETS = [
      { id: "KOSPI200",   name: "코스피 200",       source: "yahoo", yahooSymbol: "^KS200" },
      { id: "KOSPI200PF", name: "코스피 200",       source: "hl", exactCandidates: ["xyz:KR200"], keywords: ["KR200"], fallbackDex: "xyz" },
      { id: "USDKRW",     name: "원달러환율",        source: "yahoo", yahooSymbol: "KRW=X" },
      { id: "BTCPF",      name: "Bitcoin",          source: "hl", exactSymbol: "BTC" },
      { id: "SP500",      name: "S&P 500",          source: "yahoo", yahooSymbol: "^GSPC" },
      { id: "SP500PF",    name: "S&P 500",          source: "hl", exactCandidates: ["xyz:SP500", "xyz:US500"], keywords: ["SP500", "US500", "SPY"], fallbackDex: "xyz" },
      { id: "NASDAQ",     name: "NASDAQ 100",       source: "yahoo", yahooSymbol: "^NDX" },
      { id: "NASDAQPF",   name: "NASDAQ 100",       source: "hl", exactCandidates: ["xyz:XYZ100", "xyz:NDX"],  keywords: ["XYZ100", "NDX", "NAS100"], fallbackDex: "xyz" },
      { id: "GOOG",       name: "Alphabet C",       source: "yahoo", yahooSymbol: "GOOG" },
      { id: "GOOGPF",     name: "Alphabet C",       source: "hl", exactCandidates: ["xyz:GOOG", "xyz:GOOGL"], keywords: ["GOOG", "GOOGL"], fallbackDex: "xyz" },
      { id: "ANT",        name: "Anthropic",        source: "yahoo", yahooSymbol: "ANT" },
      { id: "ANTPF",      name: "Anthropic",        source: "hl", exactCandidates: ["xyz:ANT", "io:ANTH", "para:ANTH", "vntl:ANTHROPIC"], keywords: ["ANTH", "ANTHROPIC"], fallbackDex: "xyz" },
      { id: "AAPL",       name: "Apple",            source: "yahoo", yahooSymbol: "AAPL" },
      { id: "AAPLPF",     name: "Apple",            source: "hl", exactCandidates: ["xyz:AAPL"], keywords: ["AAPL"], fallbackDex: "xyz" },
      { id: "NVDA",       name: "Nvidia",           source: "yahoo", yahooSymbol: "NVDA" },
      { id: "NVDAPF",     name: "Nvidia",           source: "hl", exactCandidates: ["xyz:NVDA"], keywords: ["NVDA"], fallbackDex: "xyz" },
      { id: "SPCX",       name: "SpaceX",           source: "yahoo", yahooSymbol: "SPCX" },
      { id: "SPCXPF",     name: "SpaceX",           source: "hl", exactCandidates: ["xyz:SPCX", "io:SPCX", "xyz:SPACEX"], keywords: ["SPCX", "SPACEX"], fallbackDex: "xyz" },
      { id: "BRENT",      name: "Brent Oil",        source: "yahoo", yahooSymbol: "BZ=F" },
      { id: "BRENTPF",    name: "Brent Oil",        source: "hl", exactCandidates: ["xyz:BRENTOIL", "xyz:BRENT"], keywords: ["BRENTOIL", "BRENT", "UKOIL"], fallbackDex: "xyz" },
      { id: "DXY",        name: "US Dollar Index",  source: "yahoo", yahooSymbol: "DX-Y.NYB" },
    ];

    const state = {}; // id -> { resolvedSymbol, points: number[] }

    // 1. 초기 카드 UI 렌더링
    function initCards() {
      const container = document.getElementById("dashboard");
      container.innerHTML = ASSETS.map(asset => `
        <div class="card" id="card-${asset.id}">
          <div class="card-top">
            <div>
              <div class="name">${asset.name}${asset.source === "hl" ? '<span class="badge">PERP</span>' : ""}</div>
              <div class="symbol" id="sym-${asset.id}">심볼 확인 중...</div>
            </div>
            <div class="price-box">
              <div class="price" id="price-${asset.id}">-</div>
              <div class="change" id="chg-${asset.id}">0.00%</div>
            </div>
          </div>
          <svg class="sparkline" id="svg-${asset.id}" viewBox="0 0 240 54" preserveAspectRatio="none"></svg>
        </div>
      `).join("");
    }

    // 2. SVG Sparkline 그리기
    function renderCard(id) {
      const item = state[id];
      if (!item || !item.points || item.points.length < 2) return;

      const pts = item.points;
      const first = pts[0];
      const last = pts[pts.length - 1];
      const pct = ((last - first) / first) * 100;
      const isUp = pct >= 0;
      const color = isUp ? "#22c55e" : "#ef4444";

      const decimals = last >= 1000 ? 2 : last >= 10 ? 2 : 4;
      document.getElementById(`price-${id}`).textContent = last.toLocaleString("en-US", {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals
      });

      const chgEl = document.getElementById(`chg-${id}`);
      chgEl.textContent = `${isUp ? "+" : ""}${pct.toFixed(2)}% (24h)`;
      chgEl.className = `change ${isUp ? "up" : "down"}`;

      const hasReferencePrice = Number.isFinite(item.referencePrice) && item.referencePrice > 0;
      const scalePoints = hasReferencePrice ? [...pts, item.referencePrice] : pts;
      const min = Math.min(...scalePoints);
      const max = Math.max(...scalePoints);
      const range = max - min || 1;
      const w = 240;
      const h = 54;
      const pad = 4;
      const referenceY = hasReferencePrice
        ? h - pad - ((item.referencePrice - min) / range) * (h - pad * 2)
        : null;

      const coords = pts.map((val, idx) => {
        const x = (idx / (pts.length - 1)) * w;
        const y = h - pad - ((val - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");

      const svg = document.getElementById(`svg-${id}`);
      svg.innerHTML = `
        ${referenceY === null ? "" : `<line x1="0" y1="${referenceY.toFixed(1)}" x2="${w}" y2="${referenceY.toFixed(1)}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />`}
        <polyline fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="${coords}" />
      `;
    }

    // 3. Hyperliquid POST 요청 헬퍼
    async function postHL(payload) {
      const res = await fetch(HL_INFO_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    // 4. HIP-3 활성 DEX 목록에서 정확한 심볼 동적 탐색 (부분문자열 오매칭 방지)
    async function resolveHyperliquidSymbols() {
      const hlAssets = ASSETS.filter(a => a.source === "hl");
      const discoveredUniverse = [];

      // 기본 Perp 목록
      try {
        const mainMeta = await postHL({ type: "meta" });
        if (mainMeta?.universe) {
          mainMeta.universe.forEach(u => discoveredUniverse.push(u.name));
        }
      } catch (e) { console.warn("Main meta 조회 실패:", e); }

      // HIP-3 빌더 DEX 목록 (xyz, io, para, vntl 등)
      let dexNames = ["xyz", "io", "para", "vntl"];
      try {
        const dexs = await postHL({ type: "perpDexs" });
        if (Array.isArray(dexs)) {
          dexs.forEach(d => {
            if (d && d.name && !dexNames.includes(d.name)) dexNames.push(d.name);
          });
        }
      } catch (e) { console.warn("perpDexs 조회 실패:", e); }

      for (const dex of dexNames) {
        try {
          const dexMeta = await postHL({ type: "meta", dex });
          if (dexMeta?.universe) {
            dexMeta.universe.forEach(u => {
              const fullName = u.name.includes(":") ? u.name : `${dex}:${u.name}`;
              discoveredUniverse.push(fullName);
            });
          }
        } catch (_) {}
      }

      const universeUpperMap = new Map(
        discoveredUniverse.map(sym => [sym.toUpperCase(), sym])
      );

      for (const asset of hlAssets) {
        if (asset.exactSymbol) {
          asset.resolvedSymbol = asset.exactSymbol;
        } else {
          let matched = null;

          // 1순위: exactCandidates 목록에서 순서대로 정확히 일치하는 심볼 탐색
          if (Array.isArray(asset.exactCandidates)) {
            for (const cand of asset.exactCandidates) {
              const found = universeUpperMap.get(cand.toUpperCase());
              if (found) {
                matched = found;
                break;
              }
            }
          }

          // 2순위: 코인명(콜론 뒤 티커) 완전 일치 탐색 (CANTO 등 오매칭 방지)
          if (!matched && Array.isArray(asset.keywords)) {
            matched = discoveredUniverse.find(sym => {
              const coinPart = sym.includes(":") ? sym.split(":")[1].toUpperCase() : sym.toUpperCase();
              return asset.keywords.some(k => coinPart === k.toUpperCase());
            });
          }

          // 폴백: 기본 후보 또는 키워드 첫 번째 값
          asset.resolvedSymbol = matched || (asset.exactCandidates?.[0]) || `${asset.fallbackDex}:${asset.keywords[0]}`;
        }
        document.getElementById(`sym-${asset.id}`).textContent = asset.resolvedSymbol;
      }
    }

    // 5. Hyperliquid 24시간 캔들(15m) 초기 로드
    async function loadHyperliquidCandles() {
      const now = Date.now();
      const startTime = now - 24 * 60 * 60 * 1000;
      const candleStartTime = startTime - 15 * 60 * 1000;
      const hlAssets = ASSETS.filter(a => a.source === "hl");

      await Promise.all(hlAssets.map(async (asset) => {
        try {
          const candles = await postHL({
            type: "candleSnapshot",
            req: {
              coin: asset.resolvedSymbol,
              interval: "15m",
              startTime: candleStartTime,
              endTime: now
            }
          });
          if (Array.isArray(candles) && candles.length > 0) {
            const previousCandle = candles
              .filter(c => Number(c.t) < startTime)
              .slice(-1)[0];
            const chartCandles = candles.filter(c => Number(c.t) >= startTime);
            const closes = chartCandles.map(c => parseFloat(c.c));
            const referencePrice = previousCandle ? parseFloat(previousCandle.c) : null;
            state[asset.id] = {
              resolvedSymbol: asset.resolvedSymbol,
              points: closes,
              referencePrice: Number.isFinite(referencePrice) ? referencePrice : null
            };
            renderCard(asset.id);
          } else {
            document.getElementById(`sym-${asset.id}`).textContent += " (데이터 없음)";
          }
        } catch (err) {
          console.error(`${asset.name} 캔들 로드 오류:`, err);
        }
      }));
    }

    // 6. Hyperliquid WebSocket 실시간 스트리밍 (allMids)
    function connectHyperliquidWS() {
      const wsStatus = document.getElementById("ws-status");
      const ws = new WebSocket(HL_WS_URL);

      const hlAssets = ASSETS.filter(a => a.source === "hl");
      const dexSet = new Set([""]);
      hlAssets.forEach(a => {
        if (a.resolvedSymbol && a.resolvedSymbol.includes(":")) {
          dexSet.add(a.resolvedSymbol.split(":")[0]);
        }
      });

      ws.onopen = () => {
        wsStatus.textContent = "실시간 수신 중";
        wsStatus.style.color = "#22c55e";

        dexSet.forEach(dex => {
          const sub = { type: "allMids" };
          if (dex) sub.dex = dex;
          ws.send(JSON.stringify({ method: "subscribe", subscription: sub }));
        });
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.channel === "allMids" && msg.data?.mids) {
          const mids = msg.data.mids;
          hlAssets.forEach(asset => {
            const sym = asset.resolvedSymbol;
            if (!sym) return;
            const rawKey = sym.includes(":") ? sym.split(":")[1] : sym;
            const midStr = mids[sym] ?? mids[rawKey];

            if (midStr !== undefined && state[asset.id]) {
              const newPrice = parseFloat(midStr);
              const pts = state[asset.id].points;
              pts[pts.length - 1] = newPrice;
              renderCard(asset.id);
            }
          });
        }
      };

      ws.onclose = () => {
        wsStatus.textContent = "재연결 중...";
        wsStatus.style.color = "#ef4444";
        setTimeout(connectHyperliquidWS, 3000);
      };
    }

    // 7. 보조 지수(코스피200, 원달러환율, DXY) 1일 차트 및 주기적 폴링
    async function loadYahooIndex(asset) {
      document.getElementById(`sym-${asset.id}`).textContent = asset.yahooSymbol;
      const targetUrl = `https://query2.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(asset.yahooSymbol)}?interval=15m&range=1d`;
      // 브라우저 CORS 우회용 공개 프록시 (실서비스 배포 시 자체 Edge/서버 프록시 교체 권장)
      //const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
      const proxyUrl = `https://ticker-proxy.skykrkrk.workers.dev/?url=${encodeURIComponent(targetUrl)}`;
      

      try {
        const res = await fetch(proxyUrl);
        const json = await res.json();
        const result = json?.chart?.result?.[0];
        const closes = result?.indicators?.quote?.[0]?.close?.filter(v => v !== null);

        if (closes && closes.length > 1) {
          const referencePrice = Number(result.meta?.previousClose);
          state[asset.id] = {
            points: closes,
            referencePrice: Number.isFinite(referencePrice) ? referencePrice : null
          };
          renderCard(asset.id);
        }
      } catch (e) {
        console.warn(`${asset.name} 조회 실패:`, e);
      }
    }

    async function initYahooPolling() {
      const yahooAssets = ASSETS.filter(a => a.source === "yahoo");
      await Promise.all(yahooAssets.map(loadYahooIndex));
      setInterval(() => {
        yahooAssets.forEach(loadYahooIndex);
      }, 5000); // 30초마다 갱신
    }

    // 앱 시작
    (async function bootstrap() {
      initCards();
      await resolveHyperliquidSymbols();
      await Promise.all([
        loadHyperliquidCandles(),
        initYahooPolling()
      ]);
      connectHyperliquidWS();
    })();
  </script>
</body>
</html>
