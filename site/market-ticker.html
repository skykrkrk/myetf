<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Ticker</title>
<style>
  :root {
    --bg: #101418;
    --name: #8ec5f2;
    --text: #ffffff;
    --muted: #7d8590;
    --up: #21b36b;
    --down: #f0575b;
  }
  html, body { margin: 0; background: #1b1f24; font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }

  .ticker {
    position: relative;
    background: var(--bg);
    padding: 4px 8px 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ticker::-webkit-scrollbar { display: none; }
  .ticker-track { display: flex; flex-wrap: wrap; gap: 8px; }
  .line-break { flex: 0 0 100%; height: 0; }

  .item { display: grid; grid-template-columns: auto; column-gap: 0px; align-items: end; }
  .item.has-chart { grid-template-columns: 90px 76px; }
  .item .name  { grid-column: 1 / -1; color: var(--name); font-weight: 600; font-size: 11px; line-height: 1.2; white-space: nowrap; }
  .item .price { grid-column: 1; color: var(--text); font-weight: 600; font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .item .chg   { grid-column: 1; font-size: 11px; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item.has-chart .chg { max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
  .item .spark { grid-column: 2; grid-row: 2 / span 2; align-self: start; width: 54px; height: 24px; }
  .up   { color: var(--up); }
  .down { color: var(--down); }
  .na   { color: var(--muted); }

  .badge {
    position: absolute; top: 4px; right: 8px;
    font-size: 10px; letter-spacing: .06em; color: #f5c451;
    border: 1px solid #f5c451; border-radius: 3px; padding: 0 4px;
  }
</style>
</head>
<body>

<div class="ticker" id="ticker">
  <div class="ticker-track" id="track"></div>
</div>

<script>
/* =========================================================
 * 설정
 * ========================================================= */
const CONFIG = {
  // "demo"  : 샘플(가짜) 데이터. UI 확인용. 화면에 DEMO 표시가 뜸
  // "eodhd" : EODHD API 직접 호출 (키가 페이지에 노출됨 → 개인 테스트용)
  // "custom": 내 서버/프록시가 주는 JSON 사용 (실서비스 권장)
  // "free"  : 네이버/야후 시세. 야간선물은 apt2.me 시세를 별도 provider로 사용
  provider: "free",
  refreshSeconds: 5,

  eodhd:  { apiKey: "YOUR_API_KEY", interval: "5m" },
  custom: { endpoint: "/api/quotes" },   // GET {endpoint}?symbols=A,B,C
  apt2: { endpoint: "https://apt2.me/apt/get_realtime_indices.jsp" },

  // Yahoo, Naver, apt2 시세용 CORS 프록시.
  // 막히면 worker.js를 Cloudflare Workers에 올리고 그 주소를 아래에 넣으세요.
  // 예) "https://ticker-proxy.내계정.workers.dev"   (빈 문자열이면 직접 호출)
  free: { proxy: "https://ticker-proxy.skykrkrk.workers.dev" },

  // 기본 표시 종목. 순서/종목은 여기서 바꾸면 됨.
  // 각 항목에 chart: true를 설정하면 sparkline을 표시
  //  { name: "KOSPI 200",  symbol: "KS200.INDX", yahoo: "^KS200", naver: "KPI200", demo: 1090 },
  //  { name: "---" },
  items: [
    { name: "KOSPI",          yahoo: "^KS11", naver: "KOSPI", chart: true, demo: 5000 },
    { name: "KS200 야간선물",  code: "EUREX_FBK1", provider: "apt2", chart: true },
    { name: "KOSDAQ",         yahoo: "^KQ11", naver: "KOSDAQ", chart: true, demo: 600 },
    { name: "삼성전자",        yahoo: "005930.KS", chart: true, demo: 600 },
    { name: "SK하이닉스",      yahoo: "000660.KS", chart: true, demo: 600 },
    { name: "Nasdaq 100",     yahoo: "^NDX", chart: true, demo: 27400 },
    { name: "Nasdaq Futures", yahoo: "NQ=F", chart: true, demo: 27400 },
    { name: "S&P 500",        yahoo: "^GSPC", chart: true, demo: 7440 },
    { name: "S&P Futures",    yahoo: "ES=F", chart: true, demo: 7440  },
    { name: "VIX",            yahoo: "^VIX", chart: true, demo: 22.9  },
    { name: "Bitcoin USD",    yahoo: "BTC-USD", chart: true, demo: 67440 },
    { name: "Brent Oil",      yahoo: "BZ=F", chart: true, demo: 80.00 },
    { name: "10-Yr Bond",     yahoo: "^TNX", chart: true, demo: 5.00 },
    { name: "NVDA",           yahoo: "NVDA", chart: true, demo: 200   },
    { name: "SCHD",           yahoo: "SCHD", chart: true, demo: 86.5  },
    { name: "SPYM",           yahoo: "SPYM", chart: true, demo: 86.5  },
    { name: "QQQM",           yahoo: "QQQM", chart: true, demo: 270   },
  ]
};

// apt2 exposes no history here, so the sparkline uses distinct sampled quotes.
const apt2Series = [];

/* =========================================================
 * 데이터 공급자 어댑터
 * 반환 형식: { price, prevClose, series: [number, ...] }
 * ========================================================= */
const providers = {

  async apt2(item) {
    const url = CONFIG.free.proxy
      ? `${CONFIG.free.proxy}?url=${encodeURIComponent(CONFIG.apt2.endpoint)}`
      : CONFIG.apt2.endpoint;
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("apt2 " + res.status);
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error("apt2 returned an invalid quote list");

    const quote = rows.find(row => row && row.code === item.code);
    const price = Number(quote.current);
    const prevClose = Number(quote.open_val);
    const change = Number(quote.change);
    if (quote.current === null || quote.current === undefined ||
        quote.open_val === null || quote.open_val === undefined ||
        quote.change === null || quote.change === undefined ||
        !Number.isFinite(price) || !Number.isFinite(prevClose) || prevClose <= 0 ||
        !Number.isFinite(change)) {
      throw new Error("apt2 quote has invalid price fields: " + item.code);
    }

    if (apt2Series.length === 0 || apt2Series[apt2Series.length - 1] !== price) {
      apt2Series.push(price);
      if (apt2Series.length > 80) apt2Series.shift();
    }
    return { price, prevClose, change, series: apt2Series.slice() };
  },

  // 가짜 데이터 (랜덤워크)
  async demo(item) {
    const n = 60, prev = item.demo;
    let v = prev, series = [];
    for (let i = 0; i < n; i++) {
      v += (Math.random() - 0.5) * prev * 0.0015;
      series.push(v);
    }
    return { price: v, prevClose: prev, series };
  },

  // EODHD (실시간은 15~20분 지연일 수 있음)
  async eodhd(item) {
    const { apiKey, interval } = CONFIG.eodhd;
    const rtUrl = `https://eodhd.com/api/real-time/${item.symbol}?api_token=${apiKey}&fmt=json`;
    const rt = await (await fetch(rtUrl)).json();

    let series = [];
    try {
      const inUrl = `https://eodhd.com/api/intraday/${item.symbol}?interval=${interval}&api_token=${apiKey}&fmt=json`;
      const rows = await (await fetch(inUrl)).json();
      series = rows.slice(-80).map(r => r.close).filter(Number.isFinite);
    } catch (e) { /* 스파크라인 없이 표시 */ }

    return { price: rt.close, prevClose: rt.previousClose, series };
  },

  // 키 없는 공개 엔드포인트 (비공식: 약관상 안전하지 않고 예고 없이 바뀔 수 있음)
  //  - KOSPI 200 현재가: 네이버 polling API (지수 코드 KPI200)
  //  - 나스닥100/S&P500, 스파크라인: 야후 chart API
  async free(item) {
    const viaProxy = url => CONFIG.free.proxy
      ? `${CONFIG.free.proxy}?url=${encodeURIComponent(url)}`
      : url;

    const yahooChart = async sym => {
      const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=1d&interval=5m`;
      const res = await fetch((url));
      if (!res.ok) throw new Error("yahoo " + res.status);
      const r = (await res.json()).chart.result[0];
      const series = (r.indicators.quote[0].close || []).filter(Number.isFinite);
      return {
        price: r.meta.regularMarketPrice,
        prevClose: r.meta.chartPreviousClose ?? r.meta.previousClose,
        series
      };
    };

    const naverIndex = async code => {
      const url = `https://polling.finance.naver.com/api/realtime?query=SERVICE_INDEX:${code}`;
      const res = await fetch(viaProxy(url));
      if (!res.ok) throw new Error("naver " + res.status);
      const d = (await res.json()).result.areas[0].datas[0];
      const price = d.nv / 100;                 // 값은 100배 정수로 옴
      const mag = Math.abs(d.cv) / 100;
      const down = d.rf !== undefined ? Number(d.rf) >= 4 : d.cv < 0;  // rf 4,5 = 하락 (미검증)
      return { price, prevClose: price + (down ? mag : -mag), series: [] };
    };

    if (item.naver) {
      const q = await naverIndex(item.naver);
      try { q.series = (await yahooChart(item.yahoo)).series; } catch (e) { /* 스파크라인 없이 표시 */ }
      return q;
    }
    return yahooChart(item.yahoo);
  },

  // 내 서버: [{symbol, price, prevClose, series}, ...] 를 JSON으로 반환
  async custom(item, all) {
    if (!all.cache) {
      const syms = CONFIG.items.map(i => i.symbol).join(",");
      const res = await fetch(`${CONFIG.custom.endpoint}?symbols=${encodeURIComponent(syms)}`);
      const data = await res.json();
      all.cache = Array.isArray(data) ? Object.fromEntries(data.map(d => [d.symbol, d])) : data;
    }
    const q = all.cache[item.symbol];
    if (!q) throw new Error("no data for " + item.symbol);
    return q;
  }
};

/* =========================================================
 * 렌더링
 * ========================================================= */
const fmt = (n, d = 2) => n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = n => (n > 0 ? "+" : n < 0 ? "-" : "");

function sparkline(series, prev, up, id) {
  const W = 56, H = 24, pad = 2;
  if (!series || series.length < 2) return "";
  const lo = Math.min(...series, prev), hi = Math.max(...series, prev);
  const span = hi - lo || 1;
  const x = i => (i / (series.length - 1)) * W;
  const y = v => pad + (1 - (v - lo) / span) * (H - pad * 2);
  const pts = series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const color = up ? "var(--up)" : "var(--down)";
  const py = y(prev).toFixed(1);
  return `
  <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${color}" stop-opacity=".45"/>
        <stop offset="1" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M${pts.join(" L")} L${W},${H} L0,${H} Z" fill="url(#g${id})"/>
    <line x1="0" y1="${py}" x2="${W}" y2="${py}" stroke="#7d8590" stroke-width="1" stroke-dasharray="1.5 2.5" opacity=".7"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function renderItem(item, q, idx) {
  if (item.name === "---") return '<div class="line-break" aria-hidden="true"></div>';
  const itemClass = item.chart ? "item has-chart" : "item";
  if (!q) {
    return `<div class="${itemClass}"><div class="name">${item.name}</div><div class="price na">—</div><div class="chg na">데이터 없음</div></div>`;
  }
  const change = Number.isFinite(q.change) ? q.change : q.price - q.prevClose;
  const pct = q.prevClose ? (change / q.prevClose) * 100 : 0;
  const cls = change >= 0 ? "up" : "down";
  return `
  <div class="${itemClass}">
    <div class="name">${item.name}</div>
    <div class="price">${fmt(q.price, item.yahoo?.endsWith(".KS") ? 0 : 2)}</div>
    <div class="chg ${cls}">${sign(change)}${fmt(Math.abs(change), item.yahoo?.endsWith(".KS") ? 0 : 2)} ${sign(pct)}${fmt(Math.abs(pct))}%</div>
    ${item.chart ? sparkline(q.series, q.prevClose, change >= 0, idx) : ""}
  </div>`;
}

async function refresh() {
  const all = {};  // custom 어댑터용 1회 호출 캐시
  const fetcher = providers[CONFIG.provider];
  const results = await Promise.allSettled(CONFIG.items.map(it =>
    it.name === "---" ? Promise.resolve(null) : (it.provider ? providers[it.provider] : fetcher)(it, all)
  ));
  document.getElementById("track").innerHTML = CONFIG.items
    .map((it, i) => renderItem(it, results[i].status === "fulfilled" ? results[i].value : null, i))
    .join("");
  results.forEach((r, i) => r.status === "rejected" && console.warn(CONFIG.items[i].symbol || CONFIG.items[i].name, r.reason));
}

if (CONFIG.provider === "demo") {
  const b = document.createElement("div");
  b.className = "badge"; b.textContent = "DEMO DATA";
  document.getElementById("ticker").appendChild(b);
}
refresh();
setInterval(refresh, CONFIG.refreshSeconds * 1000);
</script>
</body>
</html>
